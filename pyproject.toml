[project]
name = "voxreg"
version = "0.0.1"
description = "Batched physical-space image registration using xarray-based VoxelData."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    "confusius>=0.8.0",
    "numpy>=2.3.4",
    "scipy>=1.16.3",
    "torch>=2.14.1",
    "xarray>=2026.9.0",
]

[project.urls]
Repository = "https://github.com/confusius-tools/voxreg"
Issues = "https://github.com/confusius-tools/voxreg/issues"

[project.optional-dependencies]
examples = [
    "matplotlib>=3.11.2",
    "nibabel>=5.4.2",
    "scipy>=1.16.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "fireants",
    "itk>=5.4.7",
    "numpydoc>=1.11.0",
    "prek>=0.4.8",
    "pytest>=9.1.1",
    "rich>=14.2.0",
    "ruff>=0.17.3",
    "scipy>=1.16.3",
    "ty>=0.0.95,<0.1.0",
]

[tool.uv.sources]
fireants = { url = "https://github.com/rohitrango/FireANTs/archive/f8a9cc259ab9113fc43bd99797000fa8fc34eb59.tar.gz" }

[tool.numpydoc_validation]
exclude = [
    '\.__init__$',
    '\._.*$',
]
checks = [
    "all",
    "GL01",
    "ES01",
    "SA01",
    "EX01",
]
numpydoc_validation_checks = ["all", "GL01", "ES01", "SA01", "EX01"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
# Match .python-version: the installed NumPy 2.5 stubs require Python >=3.12.
python-version = "3.14"
